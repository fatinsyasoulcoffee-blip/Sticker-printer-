<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Hop Hop Label Printer</title>
<script src="https://unpkg.com/niimbot-web-bluetooth@1.4.0/src/niimbot.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#222;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:16px}.brand{text-align:center;margin:8px 0 18px}.brand h1{margin:0;font-size:29px;letter-spacing:3px}.brand p{margin:5px;color:#777;font-size:13px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #00000008}label.title{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:11px;background:#fff}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts{display:flex;flex-wrap:wrap;gap:7px}.pill{position:relative}.pill input{position:absolute;opacity:0;width:0}.pill span{display:block;padding:9px 12px;border:1px solid #ccc;border-radius:99px;font-size:14px}.pill input:checked+span{background:#222;color:#fff;border-color:#222}.preview{text-align:center;background:#eee;border-radius:12px;padding:10px}canvas{width:100%;max-width:384px;height:auto;background:#fff;border:1px solid #ccc}.buttons{display:grid;gap:9px;margin-top:12px}button{border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:700}#connect{background:#ddd}#print{background:#222;color:#fff}#test{background:#fff;border:1px solid #ccc}.status{text-align:center;color:#666;font-size:13px;min-height:20px;margin-top:9px}.small{font-size:12px;color:#777;line-height:1.45;text-align:center}</style></head>
<body><main class="app"><div class="brand"><h1>HOP HOP</h1><p>Drink Label Printer · NIIMBOT B1</p></div>
<div class="card"><div class="grid"><div><label class="title">ORDER #</label><input id="order" inputmode="numeric" placeholder="125"></div><div><label class="title">LABELS</label><input id="copies" type="number" min="1" max="20" value="1"></div></div></div>
<div class="card"><label class="title">DRINK</label><select id="drink"><option>Spanish Latte</option><option>Lychee Pink Passion</option><option>Matcha Latte</option><option>Chocolate</option><option>Chocolate Mint</option><option>Mont Blanc</option><option>Other</option></select><div style="height:10px"></div><input id="custom" placeholder="Custom drink (optional)"></div>
<div class="card"><label class="title">MILK</label><div class="opts"><label class="pill"><input type="radio" name="milk" value="Regular" checked><span>Regular</span></label><label class="pill"><input type="radio" name="milk" value="Oat Milk"><span>Oat</span></label><label class="pill"><input type="radio" name="milk" value="Soy Milk"><span>Soy</span></label><label class="pill"><input type="radio" name="milk" value="Almond Milk"><span>Almond</span></label></div></div>
<div class="card"><label class="title">ICE</label><div class="opts"><label class="pill"><input type="radio" name="ice" value="Normal Ice" checked><span>Normal</span></label><label class="pill"><input type="radio" name="ice" value="Less Ice"><span>Less</span></label><label class="pill"><input type="radio" name="ice" value="No Ice"><span>No Ice</span></label></div><div style="height:10px"></div><label class="title">SUGAR</label><div class="opts"><label class="pill"><input type="radio" name="sugar" value="Normal Sugar" checked><span>Normal</span></label><label class="pill"><input type="radio" name="sugar" value="Less Sugar"><span>Less</span></label><label class="pill"><input type="radio" name="sugar" value="No Sugar"><span>No Sugar</span></label></div></div>
<div class="card"><label class="title">EXTRAS</label><div class="opts"><label class="pill"><input type="checkbox" name="extra" value="Extra Shot"><span>Extra Shot</span></label><label class="pill"><input type="checkbox" name="extra" value="Vanilla"><span>Vanilla</span></label><label class="pill"><input type="checkbox" name="extra" value="Caramel"><span>Caramel</span></label></div></div>
<div class="card"><label class="title">SPECIAL NOTE</label><textarea id="note" placeholder="e.g. half ice, no cream"></textarea></div>
<div class="card"><label class="title">PREVIEW · 50 × 30 mm</label><div class="preview"><canvas id="canvas" width="384" height="240"></canvas></div><div class="buttons"><button id="connect">🔵 CONNECT B1</button><button id="print">🖨 PRINT LABEL</button><button id="test">TEST LABEL</button></div><div id="status" class="status"></div></div>
<p class="small">B1: 203 dpi · 384 × 240 px · 50 × 30 mm<br>Chrome on Android + Bluetooth + Location required.</p></main>
<script>
const model={name_prefixes:["B1"],task:"b1",density:3,label_type:1,speed:1};
const size={w_px:384,h_px:240,offset_y_px:4};
const $=id=>document.getElementById(id), status=x=>$("status").textContent=x;
function checked(n){let e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:""}
function draw(test=false){const c=$("canvas"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,384,240);x.fillStyle="#000";x.textAlign="center";x.textBaseline="middle";x.strokeStyle="#000";x.lineWidth=2;x.strokeRect(5,5,374,230);
 if(test){x.font="bold 28px Arial";x.fillText("HOP HOP",192,55);x.font="bold 20px Arial";x.fillText("B1 TEST LABEL",192,120);x.font="16px Arial";x.fillText("50 × 30 mm",192,175);return}
 let order=$("order").value.trim()||"—", drink=($("custom").value.trim()||$("drink").value).toUpperCase();let lines=[];let m=checked("milk"),i=checked("ice"),s=checked("sugar");if(m!=="Regular")lines.push(m);if(i!=="Normal Ice")lines.push(i);if(s!=="Normal Sugar")lines.push(s);document.querySelectorAll('input[name="extra"]:checked').forEach(e=>lines.push(e.value));let note=$("note").value.trim();if(note)lines.push(note);
 x.font="bold 18px Arial";x.fillText("HOP HOP",192,25);x.font="bold 26px Arial";x.fillText("#"+order,192,58);let fs=21;if(drink.length>23)fs=18;if(drink.length>30)fs=16;x.font="bold "+fs+"px Arial";x.fillText(drink,192,101);x.font="bold 14px Arial";lines.slice(0,4).forEach((v,j)=>x.fillText(v.toUpperCase(),192,134+j*22));}
function img(){return $("canvas").toDataURL("image/png")}
["order","drink","custom","note"].forEach(id=>$(id).addEventListener("input",()=>draw()));document.querySelectorAll("input[type=radio],input[type=checkbox]").forEach(e=>e.addEventListener("change",()=>draw()));
$("connect").onclick=async()=>{try{status("Choose your B1…");await Niimbot.identify(model);status("B1 connected ✓")}catch(e){status("Connection failed: "+(e.message||e))}};
$("test").onclick=async()=>{try{status("Connecting / printing test…");draw(true);await Niimbot.printImage(img(),{model,size});status("Test label printed ✓")}catch(e){status("Print failed: "+(e.message||e))}finally{draw()}};
$("print").onclick=async()=>{try{let n=Math.max(1,Math.min(20,parseInt($("copies").value||1)));status("Printing…");draw();await Niimbot.printImage(img(),{model,size,copies:n});status("Printed "+n+" label"+(n===1?"":"s")+" ✓")}catch(e){status("Print failed: "+(e.message||e))}};
draw();
</script></body></html>
